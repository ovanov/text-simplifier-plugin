<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
    }
    h3 { font-size: 15px; margin: 0 0 10px 0; }
    label { display: block; font-weight: 600; margin: 8px 0 4px; }
    select, input[type="text"] {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 12px;
      box-sizing: border-box;
    }
    button {
      margin-top: 12px;
      width: 100%;
      padding: 8px;
      background: #0055aa;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { background: #003d7a; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .status {
      font-size: 11px;
      margin-top: 8px;
      min-height: 14px;
    }
    .status.error { color: #cc0000; }
    .status.ok { color: green; }

    #enroll-view { display: none; }
    #logged-in-view { display: none; }

    .user-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f0f4f8;
      padding: 6px 8px;
      border-radius: 4px;
      margin-bottom: 10px;
      font-size: 11px;
    }
    .user-bar a {
      color: #0055aa;
      text-decoration: none;
      cursor: pointer;
      font-weight: 600;
    }
    .user-bar a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h3>EinfachLesen — Studie</h3>

  <div id="enroll-view">
    <label for="user-id">User Id (aus der Bestätigungs-E-Mail)</label>
    <input type="text" id="user-id"
           placeholder="z. B. 0778ee0c-5c36-4905-ab91-89ef75b01391"
           autocomplete="off" spellcheck="false">

    <label for="cefr-level">Sprachniveau</label>
    <select id="cefr-level">
      <option value="A1">A1</option>
      <option value="A2">A2</option>
      <option value="B1" selected>B1</option>
      <option value="B2">B2</option>
    </select>

    <label for="backend-url">Backend URL</label>
    <input type="text" id="backend-url" value="http://localhost:8000">

    <button id="enroll-btn">Teilnehmen</button>
    <div id="enroll-status" class="status"></div>
  </div>

  <div id="logged-in-view">
    <div class="user-bar">
      <span id="participant-name"></span>
      <a id="logout-btn">Abmelden</a>
    </div>
    <div class="status ok">Angemeldet. Öffne einen unterstützten Artikel.</div>
  </div>

  <script src="dist/popup.js"></script>
</body>
</html>
