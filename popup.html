<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 280px;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
    }
    h3 {
      font-size: 15px;
      margin: 0 0 10px 0;
    }
    label {
      display: block;
      font-weight: 600;
      margin: 8px 0 4px;
    }
    select, input[type="text"], input[type="password"] {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 12px;
      box-sizing: border-box;
    }
    button {
      margin-top: 12px;
      width: 100%;
      padding: 8px;
      background: #0055aa;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover {
      background: #003d7a;
    }
    .status {
      font-size: 11px;
      margin-top: 8px;
    }
    .status.connected { color: green; }
    .status.disconnected { color: red; }
    #api-key-group { display: none; }
  </style>
</head>
<body>
  <h3>EinfachLesen</h3>

  <label for="model-select">Modell</label>
  <select id="model-select">
    <option value="huggingface-default">Laden...</option>
  </select>

  <div id="api-key-group">
    <label for="api-key">OpenAI API Key</label>
    <input type="password" id="api-key" placeholder="sk-...">
  </div>

  <label for="backend-url">Backend URL</label>
  <input type="text" id="backend-url" value="http://localhost:8000">

  <button id="save-btn">Speichern</button>

  <div id="status" class="status">Verbinde...</div>

  <script src="dist/popup.js"></script>
</body>
</html>
